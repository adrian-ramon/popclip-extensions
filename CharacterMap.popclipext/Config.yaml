# PopClip extension: show each selected character as a numbered, colour-coded tile with its spoken name
name: Character Map
identifier: com.adrianramon.popclip.character-map
description: Spell out selected text character by character, with capitals, digits and symbols colour-coded and named, for reading aloud.
keywords: character map index spell nato phonetic password read aloud
icon: 'svg:<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="12" width="16" height="22" rx="4"/><rect x="24" y="12" width="16" height="22" rx="4"/><rect x="44" y="12" width="16" height="22" rx="4"/><path d="M9 46h6M29 46h6M49 46h6"/></g></svg>'
popclip version: 4151
shellScriptRationale: The tile view is an HTML page that has to be written to a temporary file and opened in the browser, and PopClip JavaScript cannot write files.
actions:
  - title: Character Map
    shell script file: ctim.sh
    interpreter: zsh
