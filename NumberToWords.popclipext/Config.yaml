# PopClip extension: spell out a selected number or currency amount in words
name: Number to Words
identifier: com.adrianramon.popclip.number-to-words
description: Spell out numbers and amounts (£, $, €) in British English words, on their own or inside a sentence.
icon: 'svg:<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><g fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20l7-6v34M8 48h14"/><path d="M28 31h10M34 26l5 5-5 5"/><path d="M45 20h14M45 31h14M45 42h10"/></g></svg>'
popclip version: 4151
regex: '^\s*[-−]?\s*[£$€]?\s*[-−]?\s*\d(?:[\d.,''’ \u00a0\u2009\u202f]*\d)?\s*(?:GBP|USD|EUR)?\s*%?\s*$|(?:^|[^\w.,/:\-−£$€])(?:[-−]\s?)?[£$€]?\s?[-−]?(?:(?:\d{1,3}(?:,\d{3})+|\d{1,2}(?:,\d{2})+,\d{3}|\d{1,3}(?:[''’]\d{3})+|\d{1,3}(?:[\u00a0\u2009\u202f]\d{3})+|\d+)(?:\.\d+)?|(?:\d{1,3}(?:\.\d{3})+|\d{1,3}(?:[''’]\d{3})+|\d{1,3}(?:[\u00a0\u2009\u202f]\d{3})+|\d+)(?:,\d+)?)(?:\s?(?:GBP|USD|EUR)\b)?(?:\s?%)?(?![\w/:]|[.,\-−]\d)'
options:
  - identifier: output
    label: Plain click
    type: multiple
    values: [copy, paste, show]
    value labels: [Copy words to clipboard, Replace selection with words, Show words in PopClip]
    defaultValue: copy
  - identifier: decimal
    label: Decimal separator
    type: multiple
    values: [auto, point, comma]
    value labels: ["Same as my Mac", "Full stop (1,234.56)", "Comma (1.234,56)"]
    defaultValue: auto
  - identifier: capitalise
    label: Capitalise first letter
    type: boolean
    defaultValue: true
javascript file: number-words.js
